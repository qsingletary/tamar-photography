<style>
/* Layout: three full-height doors on the home page, each leading straight to its category. The blackletter name signs the home page at the bottom. Inner pages are dark, with one thin header line. */
:root{
  --bg:#0b0b0b; --ink:#eceae5; --mute:#83827d; --ph:#161616; --line:#2c2c2a;
  --name:"Manufacturing Consent","UnifrakturCook","Old English Text MT",serif;
  /* one sans family for the whole site: Jost, light */
  --big:"Jost","Futura","Century Gothic",Arial,sans-serif; --bw:300; --bk:1;
  --para:"Jost","Futura","Century Gothic",Arial,sans-serif; --pw:300; --pk:1;
  --fs:13.5px;
  --txt:"Jost","Futura","Century Gothic",Arial,sans-serif;
  --gut:max(16px,1.8vw); --gap:10px; --bar:56px; --edge:18px;
  --ease:cubic-bezier(.2,.7,.2,1);
  /* the name: face, weight, style, case, tracking and a size factor, set by the chosen logo style */
  --lf:var(--name); --lw:400; --ls:normal; --lt:lowercase; --ll:0em; --lk:1; --lz:38px;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font:400 12.5px/1.4 var(--txt);
  padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px));overflow-x:hidden}
body[data-view="home"]{padding-left:0;padding-right:0}
::selection{background:var(--ink);color:var(--bg)}
.soft{color:var(--mute);line-height:1.55}
.ttl{font:300 clamp(17px,1.6vw,23px)/1.15 var(--big);letter-spacing:-.005em}
b{font-weight:400}

/* header line */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--bg)}
.hd{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:30;height:var(--bar);display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--bg);
  padding:0 max(var(--gut),env(safe-area-inset-right,0px)) 0 max(var(--gut),env(safe-area-inset-left,0px));transition:opacity .4s}
.mark{font:var(--ls) var(--lw) calc(var(--lz) * var(--lk))/1 var(--lf);text-transform:var(--lt);letter-spacing:var(--ll);white-space:nowrap}
.r1{position:relative;display:flex;gap:clamp(18px,2.4vw,36px);align-items:baseline}
.r1>a{font:400 12.5px/1.4 "IBM Plex Mono","Courier New",monospace;text-transform:lowercase;letter-spacing:0;transition:opacity .25s}
.r1>a:hover{opacity:.6}
/* home header: one link over each door */
body[data-view="home"] .hd{background:none;display:block;height:auto;padding:0}
body[data-view="home"] .r1{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
body[data-view="home"] .r1>a{justify-self:start;margin-left:max(var(--edge),env(safe-area-inset-left,0px));padding:16px 0 6px}
/* the name signs the home page, bottom centre */
body[data-view="home"] .mark{position:fixed;left:50%;bottom:calc(36px + env(safe-area-inset-bottom,0px));--lz:36px;transform:translate(-50%,0);text-shadow:0 0 24px rgba(0,0,0,.5);cursor:default}
/* temporary chooser for the typeface */
/* temporary chooser for the type pairing and the name-click behaviour */
.tune{position:fixed;z-index:40;right:max(var(--edge),env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-end;gap:2px;color:var(--mute);font:400 12.5px/1.4 "IBM Plex Mono","Courier New",monospace;text-shadow:0 0 12px rgba(0,0,0,.8)}
.tune div{display:flex;align-items:baseline;flex-wrap:wrap;justify-content:flex-end}
.tune button{padding:3px 7px}.tune button:hover{color:var(--ink)}
.tune button[aria-pressed="true"]{color:var(--ink);text-decoration:underline;text-underline-offset:5px}
.tune span{margin-right:6px}.tune em{font-style:normal;color:var(--ink);margin-left:8px;min-width:19ch;text-align:right}
body:not([data-view="home"]) .tune{display:none}

/* home: three doors */
.doors{position:relative;display:flex;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:480px}
.doors::before{content:"";position:absolute;inset:0 0 auto;height:24%;background:linear-gradient(rgba(0,0,0,.66),rgba(0,0,0,0));z-index:2;pointer-events:none;transition:opacity .5s}
.door{position:relative;flex:1 1 0;min-width:0;min-height:0;overflow:hidden;background:var(--ph);transition:flex-grow .7s var(--ease)}
.door img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.66);transition:filter .5s}
.door::after{content:"";position:absolute;inset:auto 0 0;height:58%;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.72));pointer-events:none;transition:opacity .5s}
.door:hover,.door:focus-visible{flex-grow:1.8}
.door:hover img,.door:focus-visible img{filter:none}
.door .lab{position:absolute;z-index:2;left:max(var(--edge),env(safe-area-inset-left,0px));right:12px;bottom:clamp(84px,15vh,170px);transition:opacity .35s}
.doors:hover .door:not(:hover) .lab,.doors:has(.door:focus-visible) .door:not(:focus-visible) .lab{opacity:0}
/* category page */
.chead{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:baseline;gap:10px 24px;flex-wrap:wrap;padding-top:calc(var(--bar) + clamp(28px,4.2vw,60px));padding-bottom:clamp(20px,2.8vw,36px)}
.pick{display:flex;align-items:baseline;flex-wrap:wrap;color:var(--mute)}
.pick button{padding:4px 8px}
.pick button:hover{color:var(--ink)}
.pick button[aria-pressed="true"]{color:var(--ink);text-decoration:underline;text-underline-offset:5px}
.pick span{margin:0 8px 0 0}.pick em{font-style:normal;margin-left:10px;color:var(--ink)}
.set{padding-bottom:150px}
.it{display:block;min-width:0;transition:opacity .35s}
.pic{display:block;overflow:hidden;background:var(--ph);box-shadow:0 0 0 1px var(--line);transition:box-shadow .25s}
.it:focus-visible .pic{box-shadow:0 0 0 1px var(--ink)}
.pic img{width:100%;transition:transform 1.1s var(--ease)}
.it:hover .pic img{transform:scale(1.03)}
.cap{display:flex;flex-direction:column;gap:2px;padding-top:10px}
/* 1 edge to edge */
.g1{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(30px,3.6vw,54px) clamp(14px,1.8vw,28px)}
.g1 .pic{aspect-ratio:4/5}
.g1 .pic img{height:100%;object-fit:cover}
.g1 .soft{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.g1.s5{grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(22px,2.6vw,40px) clamp(10px,1.2vw,18px)}
/* negative space: a vertical photograph, the project name to its right, never more than three across */
.ns{display:grid;padding-bottom:150px}
.ns .it{display:flex;align-items:flex-start;gap:clamp(12px,1.3vw,20px)}
.ns.end .it{align-items:flex-end}
.ns.mid .it{align-items:center}
.ns .pic{flex:none;height:var(--h);aspect-ratio:2/3}
.ns .pic img{height:100%;object-fit:cover}
.ns .cap{padding:0;min-width:0;max-width:22ch}
.n1{--h:min(60vh,30vw);grid-template-columns:repeat(3,minmax(0,1fr));row-gap:clamp(110px,24vh,240px)}
.n2{--h:min(32vh,24vw);grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:min(17vh,12.75vw)}
.n3{--h:min(26vh,30vw);grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:min(16vh,18.5vw);padding-left:8vw}
.n2 .it,.n3 .it{grid-row:var(--r)/span 2;grid-column:var(--c);align-self:start}
.n4{--h:min(30vh,22vw);grid-template-columns:repeat(6,minmax(0,1fr));row-gap:8vh}
.n4 .it{grid-column:var(--c)/span 2}
/* 2 tight rows */
.g2 .row{display:flex;gap:var(--gap);margin-bottom:28px;max-width:calc(74vh * var(--sum,99))}
.g2 .it{flex:var(--ar) 1 0}
/* 3 offset columns */
.g3{display:flex;gap:clamp(14px,2.6vw,44px);align-items:flex-start}
.g3>div{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:clamp(40px,5vw,84px)}
.g3>div:nth-child(2){padding-top:15vw}.g3>div:nth-child(3){padding-top:6vw}
.g3:hover .it:not(:hover){opacity:.3}
/* 4 slim doors */
.g4{display:flex;height:min(74vh,780px);min-height:380px}
.g4 .it{position:relative;flex:1 1 0;overflow:hidden;transition:flex-grow .6s var(--ease)}
.g4 .it:hover,.g4 .it:focus-visible{flex-grow:var(--grow,4)}
.g4 .it:focus-visible{outline:1px solid var(--ink);outline-offset:-1px}
.g4 .pic{position:absolute;inset:0;box-shadow:none}
.g4 .pic img{height:100%;object-fit:cover;filter:brightness(.5);transition:filter .5s}
.g4 .it:hover .pic img,.g4 .it:focus-visible .pic img{filter:none;transform:none}
.g4 .it::after{content:"";position:absolute;inset:auto 0 0;height:50%;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.74));pointer-events:none}
.g4 .cap{position:absolute;z-index:2;left:14px;right:10px;bottom:16px;padding:0;white-space:nowrap;opacity:0;transition:opacity .2s}
.g4 .it:hover .cap,.g4 .it:focus-visible .cap{opacity:1;transition:opacity .35s .22s}
.g4 .soft{color:var(--ink);opacity:.7}
.g4 .v{position:absolute;z-index:2;left:50%;bottom:16px;writing-mode:vertical-rl;transform:translateX(-50%) rotate(180deg);white-space:nowrap;transition:opacity .2s}
.g4 .it:hover .v,.g4 .it:focus-visible .v{opacity:0}
/* 5 index */
.g5{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap);align-items:start}
.g5 .names{grid-column:1/7;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.g5 .names a{display:flex;align-items:baseline;gap:16px;padding:10px 0;border-bottom:1px solid var(--line);transition:color .25s}
.g5 .names b{font:300 clamp(19px,2.2vw,31px)/1.15 var(--big);letter-spacing:-.01em}
.g5 .names .soft{margin-left:auto;text-align:right;color:inherit;opacity:.6}
.g5 .names img{display:none}
.g5 .names:hover a:not(:hover){color:var(--mute)}
.g5 .view{grid-column:8/13;position:sticky;top:calc(var(--bar) + 24px);height:calc(100dvh - var(--bar) - 110px);display:flex;justify-content:flex-end;align-items:flex-start}
.g5 .view img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}

/* about and contact pages */
.page{padding-bottom:150px}
.big{font:300 clamp(22px,2.7vw,40px)/1.22 var(--big);letter-spacing:-.015em;text-wrap:pretty}
.big.sm{font-size:clamp(20px,2vw,30px)}
dl.facts{display:grid;grid-template-columns:110px minmax(0,1fr);border-top:1px solid var(--ink)}
dl.facts dt,dl.facts dd{padding:8px 0;border-bottom:1px solid var(--line)}
dl.facts dt{color:var(--mute)}
dl.facts a{text-decoration:underline;text-underline-offset:4px}
figcaption{padding-top:8px}
/* about page, four layouts */
.ab{container-type:inline-size}
.ab p{text-transform:none;letter-spacing:0;line-height:1.6;text-wrap:pretty}
.ab p.big{line-height:1.22}
.ab img{background:var(--ph)}
.ab dl.facts{max-width:440px}
/* 1 beside: one upright photograph, the words to its right, the rest left empty */
.b1{display:flex;gap:clamp(16px,2vw,32px)}
.b1 figure{flex:none;height:min(66vh,60vw);aspect-ratio:2/3;overflow:hidden}
.b1 figure img{width:100%;height:100%;object-fit:cover}
.b1 .txt{display:flex;flex-direction:column;justify-content:space-between;gap:32px;max-width:40ch;min-width:0}
.b1 .txt>div{display:flex;flex-direction:column;gap:14px}
/* 2 three words: the home page's three doors, each carrying one word about her */
.b2 .trio{display:flex;height:min(58vh,640px);min-height:300px}
.b2 .trio div{position:relative;flex:1 1 0;min-width:0;overflow:hidden;background:var(--ph)}
.b2 .trio img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.6)}
.b2 .trio div::after{content:"";position:absolute;inset:auto 0 0;height:55%;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.74))}
.b2 .trio span{position:absolute;z-index:2;left:var(--edge);right:12px;bottom:22px}
.b2 .under{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding-top:24px}
.b2 .under>*{padding:0 28px 0 var(--edge);max-width:46ch}
/* 3 blackletter: the name across the whole width, the words under it */
.b3 .huge{pointer-events:none;font:400 34cqw/.78 var(--name);text-transform:none;letter-spacing:0;white-space:nowrap;margin:0 0 clamp(30px,4.4vw,64px)}
.b3 .row{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap);row-gap:28px;align-items:start}
.b3 .row .big{grid-column:1/8}
.b3 .row .side{grid-column:9/13;display:flex;flex-direction:column;gap:20px}
/* 4 as a project: the words top right under a line, two photographs below, like a project page */
.b4 .phead{padding-top:0}
.b4 .phead>div{display:flex;flex-direction:column;gap:14px}
.b4 .jr figure{flex:var(--ar) 1 0;min-width:0}
.b4 .jr img{width:100%}
.b4 .foot{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap);padding-top:clamp(28px,4vw,56px)}
.b4 .foot dl{grid-column:8/13}
/* about, second round: one upright photograph and one plain column of text */
.k{display:flex;gap:clamp(18px,2.4vw,36px);align-items:flex-start}
.k figure{flex:none;height:min(76vh,62vw);aspect-ratio:2/3;overflow:hidden}
.k figure img{width:100%;height:100%;object-fit:cover}
.k .txt{display:flex;flex-direction:column;gap:1.05em;max-width:40ch;min-width:0;font-size:15px;color:#bdbbb5}
.k .txt p{line-height:1.62}
.k .ln{display:flex;flex-wrap:wrap;gap:6px 22px;padding-top:.6em;color:var(--ink);font:400 12.5px/1.4 "IBM Plex Mono","Courier New",monospace;text-transform:lowercase;letter-spacing:0}
.k .ln a{transition:opacity .25s}.k .ln a:hover{opacity:.6}
.k1{padding-left:min(15vw,216px)}
.k1 .txt{text-align:justify;hyphens:auto}
.k2{justify-content:space-between}
.k2 figure{order:2}
.k3{justify-content:center;align-items:flex-end}
.k4{flex-direction:column;align-items:center;gap:22px}
.k4 figure{height:auto;width:min(340px,100%)}
.k4 .txt{width:min(340px,100%);max-width:none}
/* about 1: statement */
.a1{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap);row-gap:clamp(40px,6vw,90px);align-items:start}
.a1 .big{grid-column:1/9}
.a1 .side{grid-column:9/13;display:flex;flex-direction:column;gap:24px}
.a1 figure{grid-column:1/8}
.a1 img,.a2 img{width:100%;background:var(--ph)}
/* about 2: door */
.a2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,5vw,80px);align-items:start}
.a2 img{height:calc(100dvh - var(--bar) - 200px);min-height:360px;object-fit:cover}
.a2 .txt{display:flex;flex-direction:column;gap:26px;max-width:46ch;padding-top:1vw}
/* about 3: letter */
.a3{max-width:58ch;margin:clamp(10px,3vw,50px) auto 0;display:flex;flex-direction:column;gap:1.2em;font-size:13.5px;line-height:1.75}
.a3 .sig{margin:10px 0 26px}
/* contact: shared pieces */
form input,form textarea{font:inherit;color:var(--ink);background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:10px 0;width:100%;resize:vertical}
form input:focus,form textarea:focus{outline:none;border-bottom-color:var(--ink)}
form ::placeholder{color:var(--mute);opacity:1}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.attach{display:inline-block;cursor:pointer;text-decoration:underline;text-underline-offset:4px}
.vh:focus-visible + .attach,.vh:focus-visible + .drop{outline:1px solid var(--ink);outline-offset:4px}
.files{display:flex;flex-direction:column;margin-top:10px}
.files li{display:flex;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.files .th{flex:none;width:34px;height:42px;background:var(--ph);display:grid;place-items:center;font-size:9px;color:var(--mute);overflow:hidden}
.files .th img{width:100%;height:100%;object-fit:cover}
.files .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files button{margin-left:auto;color:var(--mute);text-decoration:underline;text-underline-offset:3px}
.files button:hover{color:var(--ink)}
.send{margin-top:22px;padding:11px 26px;border:1px solid var(--ink);transition:background .25s,color .25s}
.send:hover,.send:focus-visible{background:var(--ink);color:var(--bg)}
.err{margin-top:16px;color:var(--ink)}
.err::before{content:"! ";color:var(--mute)}
#c-ok{margin-top:16px;max-width:52ch;color:var(--ink)}
/* contact 1: form */
.c1{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap);row-gap:40px;align-items:start}
.c1 .intro{grid-column:1/6;display:flex;flex-direction:column;gap:18px}
.c1 .intro .mail{color:var(--ink)}
.fields{grid-column:7/13;display:grid;grid-template-columns:110px minmax(0,1fr);align-items:start}
.fields>label,.fields>span{color:var(--mute);padding:10px 0}
.fields>div{padding:10px 0;min-width:0}
/* contact 2: sentence */
.c2{max-width:980px}
.c2 .in{display:inline-block;width:auto;max-width:100%;padding:0 2px;border-bottom-color:var(--mute)}
.c2 textarea{margin:.5em 0;padding:.2em 0;border-bottom-color:var(--mute)}
.c2 .attach{text-decoration-thickness:1px;text-underline-offset:.14em}
.c2 .files{max-width:560px}
/* contact 3: drop zone */
.c3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,5vw,80px);align-items:start}
.drop{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;text-align:center;min-height:min(56vh,520px);border:1px dashed var(--mute);padding:24px;cursor:pointer;transition:border-color .2s,background .2s}
.drop:hover,.drop.over{border-color:var(--ink);background:#131313}
.c3 .fields{grid-column:auto;grid-template-columns:1fr}
.c3 .fields>label{padding:14px 0 0}
.c3 .fields>div{padding:0}

/* project: title and description top right, photographs in pairs */
.phead{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap);padding-top:calc(var(--bar) + clamp(34px,6vw,90px));padding-bottom:clamp(34px,5vw,70px)}
.phead>div{grid-column:8/13;border-top:1px solid var(--ink);padding-top:14px}
.phead h1{font:300 clamp(20px,2.1vw,30px)/1.15 var(--big);letter-spacing:-.01em;margin-bottom:8px;text-wrap:balance}
.phead p{max-width:44ch}
.jr{display:flex;gap:var(--gap);margin:0 auto var(--gap);max-width:calc(88vh * var(--sum,99))}
.jr figure{flex:var(--ar) 1 0;min-width:0}
.jr figure img{width:100%;background:var(--ph)}
.jr.half{justify-content:center}
.jr.half figure{flex:none;width:calc(50% - var(--gap)/2)}
.pend{height:140px}

.lb{--lb-bg:var(--bg);--lb-fg:var(--ink);font:400 12.5px/1.2 var(--txt)}

/* type: one family, capitals for titles, names, links and labels; running text stays in sentence case */
body{font-family:var(--txt);font-size:var(--fs);text-transform:uppercase;letter-spacing:.04em}
.big,.soft,.a3,.a1 .side p,.a2 .txt p,dl.facts dd,form input,form textarea,.mail,.files .nm,#c-ok,.err{text-transform:none;letter-spacing:0}
.ttl,.phead h1{letter-spacing:.03em}
.cap b,.g4 .v{font:400 12.5px/1.4 "IBM Plex Mono","Courier New",monospace;text-transform:none;letter-spacing:0}
.ttl,.phead h1,.g5 .names b{font-family:var(--big);font-weight:var(--bw)}
.ttl{font-size:calc(clamp(17px,1.6vw,23px) * var(--bk))}
.phead h1{font-size:calc(clamp(20px,2.1vw,30px) * var(--bk))}
.g5 .names b{font-size:calc(clamp(19px,2.2vw,31px) * var(--bk))}
.big{font-family:var(--para);font-weight:var(--pw);font-size:calc(clamp(22px,2.7vw,40px) * var(--pk))}
.big.sm{font-size:calc(clamp(20px,2vw,30px) * var(--pk))}

@media (max-width:1150px){ .g1.s5{grid-template-columns:repeat(4,minmax(0,1fr))} }
@media (max-width:900px){
  .b3 .row .big,.b3 .row .side{grid-column:1/-1}
  .b4 .foot dl{grid-column:6/13}
  .ns{--h:min(52vw,340px);display:flex;flex-direction:column;gap:30px;padding-left:0}
  .g1{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g1.s5{grid-template-columns:repeat(3,minmax(0,1fr))}
  .phead>div{grid-column:6/13}
  .g5 .names{grid-column:1/8}.g5 .view{grid-column:9/13}
}
@media (max-width:700px){
  :root{--edge:16px}
  .k{flex-direction:column;align-items:flex-start;padding-left:0}
  .k figure{order:0;height:auto;width:min(100%,420px)}
  .k .txt{width:auto;max-width:44ch}
  .b1{flex-direction:column}
  .b1 figure{height:auto;width:62vw}
  .b2 .trio{flex-direction:column;height:auto;min-height:0;gap:2px}
  .b2 .trio div{flex:none;height:132px}
  .b2 .under{grid-template-columns:1fr;row-gap:20px}
  .b2 .under>*{padding:0}
  .b4 .foot dl{grid-column:1/-1}
  .doors{flex-direction:column}
  .door .lab{bottom:18px;font-size:19px}
  .door::after{height:70%}
  .r1{gap:14px}
  .phead>div{grid-column:3/13}
  .pick span{display:none}
  .tune em{display:none}
  .g1{grid-template-columns:1fr}
  .g1.s5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2 .row{flex-wrap:wrap;max-width:none}.g2 .it{flex-basis:40%}
  .g3>div:nth-child(2){padding-top:24vw}
  .g4{flex-direction:column;height:auto;gap:2px}
  .g4 .it{flex:none;height:108px}
  .g4 .cap{opacity:1}.g4 .v{display:none}
  .g4 .pic img{filter:brightness(.6)}
  .g5 .names{grid-column:1/-1}.g5 .view{display:none}
  .g5 .names a{align-items:center;gap:12px}
  .g5 .names img{display:block;width:52px;height:65px;object-fit:cover;flex:none}
  .g5 .names .soft{display:none}
  .a1 .big,.a1 .side,.a1 figure{grid-column:1/-1}
  .a2,.c3{grid-template-columns:1fr}
  .a2 img{height:auto;min-height:0;aspect-ratio:4/5}
  .c1 .intro,.c1 .fields{grid-column:1/-1}
  .fields{grid-template-columns:1fr}
  .fields>label,.fields>span{padding:14px 0 0}
  .fields>div{padding:0}
  .fields>span:empty{display:none}
  .drop{min-height:200px}
}
</style>
</head>
<body>

<header class="hd">
  <a class="mark" href="#" aria-label="Tamar, home">tamar</a>
  <nav class="r1" aria-label="Instagram, contact, about"></nav>
</header>
<main id="app"></main>

<script>
const {S,CATS,INFO,esc} = T;

/* header: Instagram, Contact, About */
const nav = document.querySelector('.r1');
nav.innerHTML = `<a href="${INFO.igUrl}" target="_blank" rel="noopener">Instagram</a><a href="#contact" data-v="contact">Contact</a><a href="#about" data-v="about">About</a>`;

const DOOR = {documentary:'becoming-them', studio:'studio4', street:'streets'};

/* category page layouts */
const item = s => `<a class="it" href="#p-${s.id}" style="--ar:${T.ar(s,s.cover)}"><span class="pic">${T.cover(s)}</span><span class="cap"><b>${esc(s.title)}</b></span></a>`;
const vj = s => { if(T.vert(s,s.cover)) return s.cover; const j = s.f.findIndex((_,q) => T.vert(s,q)); return j<0 ? s.cover : j; };
const store = { get(k,d){ try{ const v = localStorage.getItem(k); return v === null ? d : +v; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };
let cur = null;

/* the name on the home page is a signature only: clicking it does nothing */
document.querySelector('.mark').addEventListener('click', e => { if(T.view === 'home') e.preventDefault(); });
function drawCat(){
  const c = cur, l = T.by(c.id);
  T.app.innerHTML = `<section class="view">
    <div class="chead"><h1 class="ttl">${c.name}</h1></div>
    <div class="set g1 s5">${l.map(s => item(s)).join('')}</div>
  </section>`;
}
addEventListener('keydown', e => { const n = +e.key;
  if(e.metaKey || e.ctrlKey || (e.target.closest && e.target.closest('input,textarea,select')) || !document.querySelector('.lb').hidden || !(n>=1)) return; });

/* about page: one upright photograph set in from the left, one plain column of text beside it */
function drawAbout(){
  const s = T.get('manu');
  T.app.innerHTML = `<section class="view page"><div class="chead"></div><h1 class="vh">About</h1>
    <div class="ab k k1"><figure>${T.img(s,vj(s))}</figure>
      <div class="txt"><p>${INFO.bio}</p><p>${INFO.bio2}</p><p class="ln"><a href="${INFO.igUrl}" target="_blank" rel="noopener">${INFO.ig}</a><a href="#contact">Write to me</a></p></div></div></section>`;
}

/* contact page */
const draft = {name:'', email:'', msg:''}; let files = [];
const FILE_IN = `<input class="vh" type="file" id="c-file" multiple accept="image/*,application/pdf">`, FILE_LIST = `<ul class="files" id="c-files" aria-label="Attached files"></ul>`;
const SEND = `<p class="err" id="c-err" role="alert" hidden></p><button class="send" type="submit">Send</button><p id="c-ok" role="status" hidden></p>`;
const size = n => n > 1048576 ? (n/1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n/1024)) + ' KB';
function drawContact(){
  const body = [
    `<form class="c1" id="c-form" novalidate>
       <div class="intro"><p class="big">Let’s create</p><p class="soft">Bookings, commissions, editorial work and collaborations.</p></div>
       <div class="fields">
         <label for="c-name">Name</label><div><input id="c-name" name="name" autocomplete="name"></div>
         <label for="c-email">Email</label><div><input id="c-email" name="email" type="email" autocomplete="email"></div>
         <label for="c-msg">Message</label><div><textarea id="c-msg" name="message" rows="6"></textarea></div>
         <span>Attachments</span><div>${FILE_IN}<label class="attach" for="c-file">+ Add a portfolio, mood board or references</label>${FILE_LIST}</div>
         <span></span><div>${SEND}</div>
       </div></form>`,
  ][0];
  T.app.innerHTML = `<section class="view page"><div class="chead"><h1 class="ttl">Contact</h1></div>${body}</section>`;
  const $ = id => document.getElementById(id), form = $('c-form'), F = {name:$('c-name'), email:$('c-email'), msg:$('c-msg')};
  Object.keys(F).forEach(k => { F[k].value = draft[k]; F[k].oninput = () => draft[k] = F[k].value; });
  const list = () => { $('c-files').innerHTML = files.map((f,i) => `<li><span class="th">${f.type.startsWith('image/') ? `<img src="${f.url}" alt="">` : 'PDF'}</span><span class="nm">${esc(f.name)}</span><span class="soft">${size(f.size)}</span><button type="button" data-rm="${i}">Remove</button></li>`).join(''); };
  const add = fl => { [...fl].forEach(f => { if(f.type.startsWith('image/') || f.type==='application/pdf') files.push({name:f.name, size:f.size, type:f.type, url:f.type.startsWith('image/') ? URL.createObjectURL(f) : ''}); }); list(); };
  $('c-file').onchange = e => { add(e.target.files); e.target.value = ''; };
  $('c-files').onclick = e => { const b = e.target.closest('[data-rm]'); if(b){ files.splice(+b.dataset.rm, 1); list(); } };
  const drop = form.querySelector('.drop');
  form.ondragover = e => { e.preventDefault(); drop && drop.classList.add('over'); };
  form.ondragleave = () => drop && drop.classList.remove('over');
  form.ondrop = e => { e.preventDefault(); drop && drop.classList.remove('over'); add(e.dataTransfer.files); };
  form.onsubmit = e => { e.preventDefault(); const err = $('c-err'), ok = $('c-ok'); ok.hidden = true;
    const miss = !draft.name.trim() ? ['Add your name.', F.name] : !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(draft.email.trim()) ? ['Add an email address I can reply to.', F.email] : !draft.msg.trim() ? ['Add a short message.', F.msg] : null;
    if(miss){ err.textContent = miss[0]; err.hidden = false; miss[1].focus(); return; }
    err.hidden = true; ok.hidden = false;
    ok.innerHTML = `This form is not connected yet, so your message was not sent. For now, please message <a href="${INFO.igUrl}" target="_blank" rel="noopener" style="text-decoration:underline;text-underline-offset:4px">${INFO.ig}</a> on Instagram.`; };
  list();
}

const pairs = s => { const out=[]; for(let i=0;i<s.f.length;i+=2){ const idx = i+1<s.f.length ? [i,i+1] : [i], half = idx.length===1 && T.vert(s,i);
  const sum = idx.reduce((a,j) => a + +T.ar(s,j), 0) * (half ? 2 : 1);
  out.push(`<div class="jr ${half?'half':''}" style="--sum:${sum.toFixed(3)}">${idx.map(j => T.fig(s,j)).join('')}</div>`); } return out.join(''); };

T.start({
  viewer:{backdrop:true, wheel:true},
  home(_, app){
    const h = location.hash.slice(1);
    if(h==='about' || h==='contact'){ T.view = h; document.body.dataset.view = h; return h==='about' ? drawAbout() : drawContact(); }
    app.innerHTML = `<section class="view doors">
      <h1 style="position:absolute;left:-9999px">Tamar, photographer, New York</h1>
      ${CATS.map(c => `<a class="door" href="#${c.id}" data-c="${c.id}">${T.cover(T.get(DOOR[c.id]))}<span class="lab ttl">${c.name}</span></a>`).join('')}
    </section>`;
  },
  cat(c){
    cur = c; drawCat();
  },
  project(s, app){
    app.innerHTML = `<section class="view">
      <div class="phead"><div><h1>${esc(s.title)}</h1>${s.desc || s.talent ? `<p class="soft">${esc(s.desc || 'With ' + s.talent + '.')}</p>` : ''}</div></div>
      ${pairs(s)}<div class="pend"></div>
    </section>`;
  },
  after(){ nav.querySelectorAll('a[data-v]').forEach(a => a.dataset.v===T.view ? a.setAttribute('aria-current','page') : a.removeAttribute('aria-current')); }
});
</script>
</body>
</html>
